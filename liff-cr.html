<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>親方ドットコム</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      #status {
        margin-top: 16px;
        font-size: 15px;
        color: #333333;
        line-height: 1.6;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #eeeeee;
        border-top-color: #06c755;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="spinner"></div>
      <p id="status">読み込んでいます…</p>
    </div>
    <script type="module" src="/src/liff-cr/main.ts"></script>
  </body>
</html>
